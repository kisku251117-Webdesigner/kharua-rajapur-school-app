workflows:
  android-debug:
    name: Kharua Rajapur School Android APK
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: stable
    scripts:
      - name: Create Android platform files
        script: |
          flutter create . --platforms=android --org com.kharuarajapur
      - name: Get packages
        script: |
          flutter pub get
      - name: Build APK
        script: |
          flutter build apk --debug -t main.dart
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
